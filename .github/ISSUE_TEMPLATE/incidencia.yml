name: Incidencia
description: Registro y seguimiento de fallos
title: "[Incidencia] "
body:
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: resultado
    attributes:
      label: Resultado actual y esperado
    validations:
      required: true
  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      options:
        - Alta
        - Media
        - Baja
    validations:
      required: true
